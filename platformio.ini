; PlatformIO Project Configuration File
;
; Firmware for grogu's Bottango Impulse board (motor/servo controller).
; Vendors Bottango's official open-source Arduino driver under src/src/
; (BSD-3-Clause, see LICENSE -- named src/src/, not src/bottango/, because
; that's the include path Bottango Studio's own code exports hardcode; see
; README) with a custom BoardDefs.h and an added ESP-NOW trigger link to
; grogu's BLE receiver board -- see README.
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = bottango_impulse

[env:bottango_impulse]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; Bottango's stock firmware is Arduino-IDE-sketch shaped (top-level config
; headers + a src/ subfolder). PlatformIO's own src/ is used to hold both,
; with the vendored driver at src/src/ (kept literally named "src" to match
; the include path Bottango Studio's own code exports hardcode) -- see
; README.
; Single large app partition, no OTA slots: this board doesn't use
; Bottango's own ENABLE_ESP_OTA_UPDATE path (Studio/Desktop connects over
; USB serial for live control, not OTA), and BLE+WiFi+the full driver
; won't fit in the default OTA-sized partitions.
board_build.partitions = huge_app.csv
extra_scripts = pre:scripts/load_secrets.py
build_flags =
	-D FIRMWARE_VERSION='"0.1.0"'
lib_deps =
	fastled/FastLED@^3.7.0
